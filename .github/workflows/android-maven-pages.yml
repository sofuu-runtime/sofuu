name: Publish Android SDK Maven repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish (must match an android-sdk-v<version> release)"
        required: true
        default: "0.3.1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download the published AAR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "maven/com/sofuu/sofuu-android/$SDK_VERSION"
          gh release download "android-sdk-v$SDK_VERSION" \
            --pattern "sofuu-android-$SDK_VERSION*" \
            --dir "maven/com/sofuu/sofuu-android/$SDK_VERSION" \
            --clobber

      - name: Verify the AAR is QTSQ-linked and carries its notices
        env:
          SDK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          AAR="maven/com/sofuu/sofuu-android/$SDK_VERSION/sofuu-android-$SDK_VERSION.aar"
          POM="maven/com/sofuu/sofuu-android/$SDK_VERSION/sofuu-android-$SDK_VERSION.pom"
          for abi in arm64-v8a x86_64; do
            unzip -p "$AAR" "jni/$abi/libsofuu.so" > "/tmp/libsofuu-$abi.so"
            if grep -aqF 'built without the QTSQ codec' "/tmp/libsofuu-$abi.so"; then
              echo "✗ $abi/libsofuu.so is a QTSQ-free build; refusing to publish"
              exit 1
            fi
            if ! grep -aqF 'Invalid .qtsq format' "/tmp/libsofuu-$abi.so"; then
              echo "✗ $abi/libsofuu.so has no QTSQ codec markers"
              exit 1
            fi
            if ! grep -aqF 'verifyJWT' "/tmp/libsofuu-$abi.so"; then
              echo "✗ $abi/libsofuu.so has no sofuu.crypto marker"
              exit 1
            fi
          done
          unzip -p "$AAR" classes.jar > /tmp/sofuu-classes.jar
          unzip -p /tmp/sofuu-classes.jar 'META-INF/LICENSES/QTSQ-FORMAT.txt' > /dev/null
          unzip -p /tmp/sofuu-classes.jar 'META-INF/SOFUU-NOTICE.txt' > /dev/null
          grep -q 'QTSQ' "$POM"
          echo "✓ QTSQ-linked AAR with license and NOTICE"

      - name: Generate Maven metadata and checksums
        env:
          SDK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - "$SDK_VERSION" <<'PY'
          import datetime
          import os
          import sys
          import xml.etree.ElementTree as ET

          version = sys.argv[1]
          path = "maven/com/sofuu/sofuu-android/maven-metadata.xml"
          if os.path.exists(path):
              tree = ET.parse(path)
              root = tree.getroot()
              versioning = root.find("versioning")
          else:
              root = ET.Element("metadata")
              ET.SubElement(root, "groupId").text = "com.sofuu"
              ET.SubElement(root, "artifactId").text = "sofuu-android"
              versioning = ET.SubElement(root, "versioning")
              tree = ET.ElementTree(root)

          versions = versioning.find("versions")
          if versions is None:
              versions = ET.SubElement(versioning, "versions")
          existing = [v.text for v in versions.findall("version")]
          if version not in existing:
              ET.SubElement(versions, "version").text = version

          for tag in ("latest", "release"):
              node = versioning.find(tag)
              if node is None:
                  node = ET.SubElement(versioning, tag)
              node.text = version
          updated = versioning.find("lastUpdated")
          if updated is None:
              updated = ET.SubElement(versioning, "lastUpdated")
          updated.text = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M%S")
          ET.indent(tree, space="  ")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          PY
          find maven -type f \
            ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' \
            -print0 | while IFS= read -r -d '' f; do
              sha1sum "$f" | awk '{print $1}' > "$f.sha1"
              md5sum "$f" | awk '{print $1}' > "$f.md5"
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
              sha512sum "$f" | awk '{print $1}' > "$f.sha512"
            done

      - name: Commit and push to gh-pages
        env:
          SDK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven
          if git diff --cached --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "Publish com.sofuu:sofuu-android:$SDK_VERSION"
          git push origin HEAD:gh-pages
