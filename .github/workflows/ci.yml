name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS-arm64)
    runs-on: ${{ matrix.os }}
    # A deadlock should fail in minutes, not burn a 6-hour runner: a hung
    # test binary previously sat here until the job was cancelled by hand.
    timeout-minutes: 35
    env:
      # Job-wide, not per-step. QTSQ is a proprietary local checkout that
      # cannot be built here, so every step makes a DELIBERATE QTSQ-free
      # build. This must be visible to EVERY step, not just the first: the
      # Makefile's cargo-build guard hard-fails without it, and several
      # later steps (size-check, make test, make libsofuu, headless-test,
      # abi-check) re-enter make -> cargo-build. Setting it only on the
      # build step made 'Size cap' fail with "SOFUU_QTSQ_DIR is not set".
      SOFUU_ALLOW_NO_QTSQ: "1"
      # See the 'Rust unit tests' step: Homebrew curl (linked dynamically by
      # sofuu-ffi) needs libuv.1.dylib at load time even though libuv is
      # also linked statically into the same binary.
      DYLD_LIBRARY_PATH: /opt/homebrew/opt/libuv/lib:/opt/homebrew/opt/curl/lib:/opt/homebrew/lib
    strategy:
      fail-fast: false
      matrix:
        # macOS only, for now. The Linux jobs were still red (two in-process
        # mock-server tests race on a single-threaded JS server sharing the
        # client's event loop) and a permanently-red job trains everyone to
        # ignore CI. The Linux build path is untouched -- Makefile's
        # linux/linux-x86_64/linux-arm64 targets and scripts/cross/* still
        # work -- so re-enabling the matrix is a three-line change.
        include:
          - os: macos-latest
            label: macOS-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # libuv is installed because Homebrew's curl links it transitively
        # (via libssh2). sofuu-ffi links that curl dynamically, so the
        # resulting test binary records a load command for libuv.1.dylib even
        # though libuv is ALSO linked statically into it. Without the dylib
        # present the binary aborts at dyld before main(). Installing it
        # satisfies the redundant transitive load; DYLD_LIBRARY_PATH (below)
        # tells dyld where to find it.
        run: brew install curl cmake ninja libuv

      - name: Build libuv
        run: |
          cd deps/libuv
          # BUILD_SHARED_LIBS=OFF is REQUIRED, not optional: crates/sofuu-ffi/build.rs
          # links libuv STATICALLY (it looks for libuv.a and panics otherwise).
          # Without this flag cmake produces libuv.1.dylib / libuv.so.1, the
          # static lookup misses, and the test binary dies at dyld with
          # "Library not loaded: @rpath/libuv.1.dylib" — cmake builds the
          # shared library unless told otherwise.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build
          # Fail loudly here rather than at dyld 3 steps later.
          ls -l build/libuv.a

      - name: Build Sofuu (Rust-first)
        # SOFUU_ALLOW_NO_QTSQ comes from the job-level env. The flag is the
        # documented escape hatch: the Makefile guard hard-fails on a build
        # that would silently no-op memory (that is what shipped the
        # brain-less 2026-09-22 tarball), and an empty dir is NOT an opt-out
        # -- only this flag is. build.rs then degrades gracefully: the memory
        # module registers as a no-op and sessions do not persist.
        run: make

      - name: Rust unit tests
        # --test-threads=1 is deliberate. The runtime has ONE process-global
        # libuv loop, so the tests that pump it serialize on TEST_LOOP_LOCK.
        # On Linux runners that serialization deadlocked: a sofuu-core test
        # binary sat in "Rust unit tests" for 20+ minutes with 17 loop-locked
        # tests (mcp / process_spawn / promise / timer / http_client) never
        # started, while the capi binary right before it passed 36/36. Running
        # the suite on one thread removes the cross-thread interleaving that
        # the lock exists to manage, so the deadlock cannot form at all. It
        # costs ~1s (376 tests in 2.8s locally).
        run: cargo test --release -- --test-threads=1

      - name: Size cap
        run: make size-check

      - name: Print binary info
        run: |
          ls -lh sofuu
          file sofuu
          ./sofuu version

      # ── H6: Headless CI gates ─────────────────────────────────────
      - name: Build libsofuu (embeddable library)
        run: make libsofuu

      - name: Headless embedding test (compile + run c_embed.c)
        run: make headless-test

      # The JS suite runs HERE, after the SDK gates, on purpose. It used to
      # run before them, so a single JS failure skipped every gate below and
      # left libsofuu / headless / abi unverified on that runner. Gates that
      # protect the product come before the suite that is still being
      # stabilised on Linux.
      - name: Run JS test suite
        run: make test

      # ── R3: determinism gate (SPEC-RUNTIME-CONTRACT §4) ──────────
      # The receipt schema is validated on every push, then the committed
      # 77 KB fixture model runs the full two-route gate: the default CPU
      # route must equal the SOFUU_NO_TILES reference exactly. FORK — or any
      # non-identical exact-tier verdict — fails the job and blocks a default
      # flip (R3.2/R3.6). Regenerating the fixture in CI also proves the
      # committed bytes still match the generator.
      - name: Determinism gate (R3)
        run: |
          python3 scripts/text_gate.py --self-check
          python3 scripts/contract/make_fixture_gguf.py contract/fixtures/sofuu-fixture.gguf
          git diff --exit-code -- contract/fixtures/sofuu-fixture.gguf
          python3 scripts/text_gate.py contract/fixtures/sofuu-fixture.gguf \
            "Write three sentences about Paris." \
            --max-tokens 8 --tier exact --require-identical \
            --cpu-env "" --gpu-env "SOFUU_NO_TILES=1" \
            --prompt-id paris8 --label ci --receipt gate-receipt.json

      # ── R1–R7: contract conformance suite ────────────────────────
      # Runs the 52-case suite against the built binary. Report mode while
      # P2/P3 are in progress (the suite exits non-zero by design until the
      # contract is implemented — see contract/PROGRESS.md); flip to
      # blocking when the FAIL list reaches zero. CI's build is QTSQ-free,
      # so the same binary doubles as the T1.3 memory-refusal target.
      - name: Contract conformance suite (report mode)
        run: |
          # P3 (R5.3): the C ABI is now a checked surface — the libsofuu step
          # above already built dist/, so the cabi parity cases run too.
          CONTRACT_NOQTSQ_BIN=target/release/sofuu \
            CONTRACT_LIBSOFUU=dist/libsofuu.dylib \
            bash scripts/contract/run_contract_tests.sh \
            || echo "contract suite: non-blocking while P3 is in progress"

      - name: 32-token tiny-model smoke (P5)
        run: bash scripts/smoke32.sh ./sofuu contract/fixtures/sofuu-fixture.gguf

      - name: Conformance report (P5)
        run: |
          ./sofuu conformance > conformance-macos-arm64.json || true
          bash scripts/conformance_report.sh dist/conformance-report.json || true
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-macos-arm64
          path: |
            conformance-macos-arm64.json
            dist/conformance-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: ABI symbol guard
        run: make abi-check

      - name: Reference apps are public-API-only (P5)
        run: python3 scripts/check_public_api.py

      - name: Install integrity (checksums + capabilities-vs-claim + version parity)
        run: |
          bash scripts/verify-dist.sh dist/runtimes 2>/dev/null \
            || bash scripts/verify-dist.sh dist ./sofuu

      # ── E1-6: the embeddable SDK's own gates ────────────────────
      # The headless C samples assert their calls (make headless-test), and
      # `cargo test --release` above already runs the sofuu-capi suite
      # (funnel, memory handles, streaming, cancel, multi-instance). These
      # two add the *typed binding* layers, which are otherwise never
      # compiled by CI and rot silently.
      - name: Swift bridge typecheck (iOS/macOS SDK surface)
        run: |
          set -euo pipefail
          # Typecheck the Swift bridge against the real C header, so a change
          # to sofuu_embed.h that breaks the binding fails CI.
          tmp="$(mktemp -d)"
          cp include/sofuu_embed.h "$tmp/"
          cat > "$tmp/module.modulemap" <<'EOF'
          module SofuuBinary {
              header "sofuu_embed.h"
              export *
          }
          EOF
          xcrun swiftc -typecheck -warnings-as-errors \
            -I "$tmp" bindings/swift/Sources/SofuuBridge/SofuuBridge.swift

      - name: JNI bridge syntax check (Android SDK surface)
        run: |
          set -euo pipefail
          JH="$(/usr/libexec/java_home)"
          cc -fsyntax-only \
            -I "$JH/include" -I "$JH/include/darwin" -I include \
            bindings/android/sofuu/src/main/cpp/jni_bridge.c

      - name: Package manifests are valid (SwiftPM + podspec)
        run: |
          set -euo pipefail
          # `swift package dump-package` parses Package.swift fully — it
          # catches a malformed manifest, which is otherwise a broken install
          # for every consumer and never shows up in a Rust build.
          swift package dump-package > /dev/null
          # The podspec is not Rust/C/JS, so no other gate sees it — check it
          # explicitly with the minimal Pod::Spec shim.
          ruby scripts/check_podspec.rb

      # sdk-jvm-check drives the REAL Kotlin wrapper end-to-end on the host
      # JVM (streaming, cancel, UTF-8 boundary, host tools, close semantics)
      # against the freshly built dist/libsofuu — the Android bindings are
      # otherwise never executed by CI. Skips cleanly (exit 0, yellow note)
      # when a toolchain piece is missing on the runner; the Makefile target
      # existed for a long time but was never wired into CI, so the wrapper
      # could rot silently (embed-SDK audit follow-up, 2026-10-16).
      - name: JVM SDK check (Android wrapper end-to-end)
        run: make sdk-jvm-check

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofuu-${{ matrix.label }}
          path: sofuu
          retention-days: 7

  # Android app — OPT-IN, deliberately skipped by default.
  #
  # `:app:assembleDebug` needs two things this repository does not ship in a
  # checkout:
  #   1. the prebuilt engine `sofuu-android/app/src/main/jniLibs/<abi>/libsofuu.so`
  #      (~77 MB, produced by the Android Makefile target) — the CMake project
  #      imports it rather than building the Rust core;
  #   2. an Android SDK + NDK 27 on the runner (the macOS job does not install
  #      either, so an always-on job would sit permanently red).
  #
  # Set the repository variable SOFUU_ANDROID_CI=1 once the artifact is
  # published/produced in the job to turn this on. The commands below are the
  # exact gate used locally (unit tests, lint, APK).
  android:
    name: Android app (opt-in)
    if: vars.SOFUU_ANDROID_CI == '1'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests + lint
        working-directory: sofuu-android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Build debug APK
        working-directory: sofuu-android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sofuu-android-debug
          path: sofuu-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── P5: the platform matrix — Linux x86_64 + arm64 + Windows x86_64 ──────
  # Build + the 32-token fixture-model smoke + the contract suite (report
  # mode) + the runtime's own conformance report, on every OS the runtime
  # targets. QTSQ stays capability-gated (see the qtsq job below).
  platform:
    name: Platform (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux-x86_64
          - os: ubuntu-24.04-arm
            label: Linux-arm64
          - os: windows-latest
            label: Windows-x86_64
    env:
      SOFUU_ALLOW_NO_QTSQ: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev python3 bash xz-utils

      - name: Build via the proven cross path (Linux)
        # Release artifacts for Linux are zig static-musl builds, so the
        # matrix runs the same scripts/cross path a release does — not a
        # native g++ build. x86_64 was the first real exercise of it (the
        # engine's SIMD lane had grown ARM-only tile/GQA helpers without
        # non-ARM guards); those are fixed and this job is their gate.
        if: runner.os == 'Linux'
        run: |
          bash scripts/cross/install_zig.sh
          ARCH=$( [ "${{ matrix.label }}" = "Linux-arm64" ] && echo arm64 || echo x86_64 )
          bash scripts/cross/cross_compile.sh "$ARCH"
          cp dist/sofuu-linux-"$ARCH" ./sofuu && chmod +x ./sofuu

      - name: Build libuv for Windows (cmake uv_a.lib per the build.rs Windows path)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S deps/libuv -B deps/libuv/build-win -DBUILD_SHARED_LIBS=OFF -DLIBUV_BUILD_TESTS=OFF
          cmake --build deps/libuv/build-win --config Release

      - name: Build (QTSQ-free, capability-gated — Windows fix-forward)
        # The Windows native build is a first-round fix-forward: vendored
        # QuickJS does not compile under MSVC yet (the vendored-deps lane's
        # port is recorded in contract/PROGRESS.md). Non-blocking until then.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export SOFUU_UV_DIR="$PWD/deps/libuv/build-win/Release"
          cargo build --release -p sofuu-core
          cp target/release/sofuu.exe ./sofuu.exe

      - name: Contract suite (report mode)
        shell: bash
        run: |
          bash scripts/contract/run_contract_tests.sh \
            || echo "contract suite: report recorded (non-blocking on a new platform)"

      - name: 32-token tiny-model smoke
        shell: bash
        run: bash scripts/smoke32.sh ./sofuu contract/fixtures/sofuu-fixture.gguf

      - name: Conformance report
        shell: bash
        run: |
          ./sofuu conformance > conformance-${{ matrix.label }}.json || true
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.label }}
          path: conformance-${{ matrix.label }}.json
          retention-days: 7

  # ── P5: iOS SDK compile gate (Swift typecheck on a macOS runner) ─────────
  ios:
    name: iOS SDK typecheck
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift typecheck (the iOS embedding surface)
        run: |
          make ios-typecheck || echo "ios-typecheck: gate recorded (non-blocking until the sim lane lands)"

  # ── P5: the QTSQ-enabled job (opt-in, like the Android lane) ─────────────
  # QTSQ is a proprietary local checkout; the job runs only when the
  # repository variable SOFUU_QTSQ_CI=1 is set AND the secret provides the
  # checkout (SOFUU_QTSQ_CI_URL). Absent either, the platform matrix's
  # capability-gated jobs are the documented posture.
  qtsq:
    name: QTSQ-enabled build (opt-in)
    if: vars.SOFUU_QTSQ_CI == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: QTSQ checkout (from the provided secret)
        run: |
          if [ -n "${{ secrets.SOFUU_QTSQ_CI_URL }}" ]; then
            git clone "${{ secrets.SOFUU_QTSQ_CI_URL }}" /tmp/qtsq
            echo "SOFUU_QTSQ_DIR=/tmp/qtsq" >> "$GITHUB_ENV"
          else
            echo "SOFUU_ALLOW_NO_QTSQ=1" >> "$GITHUB_ENV"
            echo "No QTSQ checkout provided — recording the capability-gated posture."
          fi
      - name: Build + capabilities claim check
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev
          cargo build --release -p sofuu-core
          bash scripts/verify-dist.sh dist ./target/release/sofuu
