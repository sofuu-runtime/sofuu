name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
          - os: ubuntu-22.04
            label: Linux-x86_64
          - os: ubuntu-22.04-arm
            label: Linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl cmake ninja

      - name: Build libuv
        run: |
          cd deps/libuv
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_TESTING=OFF
          cmake --build build

      - name: Build Sofuu (Rust-first)
        # QTSQ is a proprietary local checkout — CI builds without it
        # (build.rs degrades gracefully: no brain persistence / sessions).
        env:
          SOFUU_QTSQ_DIR: /tmp/sofuu-no-qtsq
        run: |
          mkdir -p /tmp/sofuu-no-qtsq
          make

      - name: Rust unit tests
        env:
          SOFUU_QTSQ_DIR: /tmp/sofuu-no-qtsq
        run: cargo test --release

      - name: Size cap
        run: make size-check

      - name: Print binary info
        run: |
          ls -lh sofuu
          file sofuu
          ./sofuu version

      - name: Run JS test suite
        run: make test

      # ── H6: Headless CI gates ─────────────────────────────────────
      - name: Build libsofuu (embeddable library)
        run: make libsofuu

      - name: Headless embedding test (compile + run c_embed.c)
        run: make headless-test

      - name: ABI symbol guard
        run: make abi-check

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofuu-${{ matrix.label }}
          path: sofuu
          retention-days: 7
