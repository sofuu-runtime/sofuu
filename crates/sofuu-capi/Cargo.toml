[package]
name = "sofuu-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "libsofuu — the embeddable Sofuu C ABI (PLAN-HEADLESS H1)"

# staticlib + cdylib: `make libsofuu` ships target/release/libsofuu.{a,dylib}
# + include/sofuu_embed.h. The core crates stay binary-first; this crate owns
# the exported symbol list (see the export list in src/lib.rs).
[lib]
name = "sofuu_capi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# UI embedding (PLAN-EMBEDDED-NATIVE-HOST-C-ABI) is ON by default so the
# shipped libsofuu carries `sofuu_ui_*`; server/headless consumers build with
# `--no-default-features` and get exactly the frozen v2 surface.
default = ["ui"]
ui = ["dep:sofuu-ui"]
# Platform-accelerated Mode B backends. They are additive aliases today: the
# Direct Surface renderer lands with PLAN-CROSS-PLATFORM-GPU-WINDOW-BACKENDS;
# until then `sofuu_ui_surface_*` returns SOFUU_ERR_NOT_IMPL (-2) while the
# Mode A zero-copy DrawList ABI stays fully functional.
ui-metal = ["ui"]
ui-gles = ["ui"]
ui-surface = ["ui"]

[dependencies]
sofuu-core = { path = "../sofuu-core" }
sofuu-ffi = { path = "../sofuu-ffi" }
sofuu-ui = { path = "../sofuu-ui", optional = true }
serde_json = { version = "1", default-features = false, features = ["std"] }
libc = "0.2"

# NOTE: nothing may depend on sofuu-capi (no dev-dependency cycle back into
# it) — the same fat-LTO "symbol multiply defined" lesson as sofuu-ffi's
# Cargo.toml. Its tests live in-crate (#[cfg(test)]) and link each dependency
# exactly once.
